<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mein Raum</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mein Raum"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F2F2F7">
<style>
:root{--bg:#fff;--tx:#1D1D1F;--m:#6E6E73;--c:#fff;--ln:#E8E8ED;--ac:#007AFF;box-sizing:border-box;color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
:root[data-theme=light]{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--tx:#F5F5F7;--m:#98989D;--c:#1C1C1E;--ln:#38383A}}
:root[data-theme=dark]{--bg:#000;--tx:#F5F5F7;--m:#98989D;--c:#1C1C1E;--ln:#38383A;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:20px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px}
h2{font-size:38px;margin:16px 0;letter-spacing:-.5px}
.m,small{color:var(--m)}small{display:block;font-size:16px}
.h{cursor:pointer;transition:opacity .15s}.h:hover{opacity:.82}.h:focus{outline:none;opacity:.8}.h:focus-visible,.b:focus-visible,input:focus-visible,.cc:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b{font:inherit;background:var(--c);color:var(--ac);border:1px solid var(--ln);border-radius:0;padding:14px 26px;cursor:pointer;font-weight:500}
.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
input,textarea{font:inherit;color:var(--tx);background:var(--c);border:1px solid var(--ln);border-radius:0;padding:14px 18px;min-width:0}
.f{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}.f input:not([type=file]){flex:1 1 220px}
.r{display:flex;align-items:center;gap:16px;background:var(--c);border:1px solid var(--ln);border-radius:0;padding:22px 26px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.g{flex:1;min-width:0;overflow-wrap:anywhere}.g a{display:block;color:var(--ac);font-size:17px}.g audio{width:100%;margin-top:6px}
.cd{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.dy{font:inherit;color:var(--tx);background:var(--c);border:1px solid var(--ln);border-radius:0;padding:20px 0;cursor:pointer;position:relative}
.dy.sel{background:var(--ac);color:#fff}.dy.td{border-color:var(--ac)}.dy i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#FF9500}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.cv{background:var(--c);border:1px solid var(--ln);border-radius:0;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.cv b{font-size:34px;display:block}
.pl{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.br{width:100%;max-width:420px;display:block;margin:0 auto}.br g{transition:transform 1s cubic-bezier(.2,.8,.2,1)}.br.s .L{transform:translateX(-9px)}.br.s .R{transform:translateX(9px)}
.ch{display:flex;gap:10px;opacity:0;animation:fi .6s 1s forwards}.ch .b{flex:1;padding:16px 8px;font-weight:500}
@keyframes fi{to{opacity:1}}
#tm,#pt{font-size:clamp(80px,20vw,140px)!important}.br{max-width:560px}input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac)}svg rect{rx:0;ry:0}
h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin:30px 0 12px;font-weight:600}.cv small{text-transform:uppercase;letter-spacing:.1em;font-size:13px}b{font-weight:600}
svg [fill="#F2C9A5"]{fill:var(--sk1,#F2C9A5)}svg [fill="#E3B38D"]{fill:var(--sk2,#E3B38D)}svg path[fill="#3A3A3C"]{fill:var(--hr,#3A3A3C)}svg path[fill="#007AFF"]{fill:var(--sh,#007AFF);stroke:var(--sh,#007AFF)}main{zoom:var(--z,1)}
@keyframes zi{from{opacity:0;transform:scale(1.04)}}#v:not([hidden]),#sc:not([hidden]){animation:zi .35s ease}
.clip{background:#CFC8BA;padding:46px 22px 22px;position:relative;margin:20px 0}
.clp{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:130px;height:40px;background:#6E6E73}
.clp:after{content:"";position:absolute;left:50%;top:10px;width:30px;height:8px;margin-left:-15px;background:#CFC8BA}
.paper{background:var(--c);border:1px solid var(--ln);padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--ln);border-top:1px solid var(--ln)}
.cg.wd{border:0;text-align:center;margin-bottom:6px}.cg.wd small{text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.cc{aspect-ratio:2/3;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:6px;cursor:pointer;overflow:hidden;min-width:0}
.cc.we{background:rgba(128,128,128,.04)}.cc.o{background:rgba(128,128,128,.09);color:var(--m)}.cc.sel{outline:2px solid var(--ac);outline-offset:-2px}
.dn{display:inline-block;min-width:28px;height:28px;line-height:28px;text-align:center;font-size:16px;font-weight:600}.dn.tdy{background:#FF3B30;color:#fff}
.ev{display:block;background:var(--ac);color:#fff;font-size:13px;line-height:20px;padding:0 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.tr{background:#34C759}
.cc small{font-size:12px}
@media(max-width:600px){.cc{min-height:62px;padding:3px}.ev{height:6px;padding:0;margin-top:2px}.ev .t{display:none}.dn{min-width:22px;height:22px;line-height:22px;font-size:14px}.clip{padding:40px 8px 8px}.paper{padding:8px}.cc small{display:none}}

/* ---- v2: Handy-Layout, Bedienung, Barrierefreiheit ---- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font-family:inherit;max-width:100%}
button,summary,.h,.cc,.dy{touch-action:manipulation;-webkit-touch-callout:none}
button,summary,.h,.cc{-webkit-user-select:none;user-select:none}
.b:active,.h:active,.cc:active,summary:active{opacity:.55}
.err{color:#d70f3c;font-weight:600}
.f select{flex:1 1 160px;min-width:0}
.f.fi{margin-bottom:12px}.f.fi input:not([type=file]){flex:1 1 120px}
.r{flex-wrap:wrap}.r .g{flex:1 1 140px}
.gr .b{padding:14px 10px}
.gr.st{grid-template-columns:repeat(2,1fr)}
.gr.tm{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.gr.tm .b{font-size:17px;padding:14px 8px;overflow-wrap:anywhere;hyphens:auto;line-height:1.25}
@media(max-width:480px){.gr.tm{grid-template-columns:repeat(2,1fr)}}
@media(min-width:700px){.gr.nv{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.gr.st{grid-template-columns:repeat(4,1fr)}.gr.st .cv b{font-size:clamp(22px,2.4vw,28px)}.gr.nv{grid-template-columns:repeat(6,1fr)}}
.cv b{font-size:clamp(20px,5.2vw,34px);overflow-wrap:anywhere;hyphens:auto}
.hd{gap:6px}.hd b{flex:1 1 auto;min-width:0;font-size:clamp(15px,4.2vw,26px);text-align:center;line-height:1.15}main .hd .b{padding:10px 10px}.hd>div{display:flex;gap:6px;flex:none}.hd>.b{flex:none}.hd .b{min-width:44px}@media(max-width:600px){.paper{padding-top:14px}}@media(max-width:370px){.hd{flex-wrap:wrap}.hd b{order:-1;flex:1 0 100%;margin:2px 0 4px}}
details.lu{margin-top:6px}
details.lu>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--ln);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-weight:600}
details.lu>summary::-webkit-details-marker{display:none}
details.lu>summary::after{content:"+";font-size:26px;letter-spacing:0;line-height:1}
details.lu[open]>summary::after{content:"\2013"}
details.lu .gr{margin-top:6px}
#nv h3{margin:26px 0 10px}
#sdot{font-size:15px}
html[data-first=room] main{display:flex;flex-direction:column}
html[data-first=room] #sc{order:-1}
@media(max-width:600px){main{padding:20px 16px}h2{font-size:34px;margin:12px 0}.r{padding:16px 18px;gap:12px}.cv{padding:16px}.b{padding:12px 18px}.hd .b{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* ---- v3: Zustandsfarben (Hell, Dunkel, erhöhter Kontrast), Reiterleiste, Heute, Raum ---- */
:root{--k-w:#007A62;--k-t:#A65400;--k-r:#5B5FC7;--k-f:#D70F3C;--k-n:#6C6C70;--k-sw:2.5}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--k-w:#3DD6A8;--k-t:#FFB340;--k-r:#A5A3FF;--k-f:#FF6B81;--k-n:#98989D}}
:root[data-theme=dark]{--k-w:#3DD6A8;--k-t:#FFB340;--k-r:#A5A3FF;--k-f:#FF6B81;--k-n:#98989D}
@media(prefers-color-scheme:light){:root[data-hc]:not([data-theme=dark]){--k-w:#005E4B;--k-t:#814200;--k-r:#464999;--k-f:#A60C2E;--k-n:#525255;--k-sw:4}}
@media(prefers-color-scheme:dark){:root[data-hc][data-theme=light]{--k-w:#005E4B;--k-t:#814200;--k-r:#464999;--k-f:#A60C2E;--k-n:#525255;--k-sw:4}}
@media(prefers-contrast:more) and (prefers-color-scheme:light){:root:not([data-theme=dark]){--k-w:#005E4B;--k-t:#814200;--k-r:#464999;--k-f:#A60C2E;--k-n:#525255;--k-sw:4}}
@media(prefers-contrast:more) and (prefers-color-scheme:dark){:root[data-theme=light]{--k-w:#005E4B;--k-t:#814200;--k-r:#464999;--k-f:#A60C2E;--k-n:#525255;--k-sw:4}}
@media(prefers-contrast:more){:root{--k-sw:4}}
:root[data-hc]{--k-sw:4}
@media(prefers-contrast:more) and (prefers-color-scheme:dark){:root:not([data-theme=light]){--k-sw:4}}
:root[data-hc] .b,:root[data-hc] .r,:root[data-hc] .cv{border-color:var(--tx)}
@media(prefers-contrast:more){.b,.r,.cv{border-color:var(--tx)}}

/* Reiterleiste */
#tb{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;background:var(--c);border-top:1px solid var(--ln);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.v3 #tb{display:flex}
body.v3 main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tbb{flex:1;min-height:56px;border:0;background:none;color:var(--m);font:inherit;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation}
.tbb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbb[aria-current=page]{color:var(--ac);font-weight:700}
.tbb:focus-visible{outline:2px solid var(--ac);outline-offset:-4px}
body.v3 #nv{display:none}
body.v3 #ts{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}

/* Zeichen und Wörter für Zustände */
svg.gl{width:1.15em;height:1.15em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw{color:var(--k-w)}.st{color:var(--k-t)}.sr{color:var(--k-r)}.sf{color:var(--k-f)}.sn{color:var(--k-n)}
.stw{font-weight:600;white-space:nowrap}
html[data-fb=still] .sw,html[data-fb=still] .st,html[data-fb=still] .sr,html[data-fb=still] .sf{color:var(--m)}

/* Heute */
.x3j{border-width:2px;border-color:var(--ac)}
.x3j b,.x3c b{font-size:26px;display:block;line-height:1.25}
.x3j .f{margin:14px 0 0}
.x3j .f .b{flex:1 1 130px}
.x3c .m{margin:4px 0}
.x3sm{font-size:15px;color:var(--m)}
.x3chk{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);min-height:48px}
.x3chk label{flex:1;cursor:pointer;align-self:stretch;display:flex;align-items:center;min-height:44px}
.x3chk input[type=checkbox]{width:28px;height:28px;flex:none}
.x3tm{font-size:clamp(72px,22vw,120px);font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1;margin:10px 0}
.x3lv .b[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.x3why .b{flex:1 1 120px}
.x3note{border-left:4px solid var(--k-r);padding:10px 14px;margin:0 0 14px;background:var(--c)}
.x3bad{border-left-color:var(--k-f)}
.x3ok{border-left-color:var(--k-w)}
svg.band{width:100%;max-width:420px;height:26px;display:block;margin:6px 0 2px}
.x3days{display:flex;flex-wrap:wrap;gap:8px}.x3days label{display:flex;align-items:center;gap:6px;min-height:44px}
.x3seg{display:flex;gap:0;flex-wrap:wrap}.x3seg .b[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.x3bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0}.x3bars i{flex:1;background:var(--k-w);min-height:3px;display:block}.x3bars i.z{background:none;border-top:2px dashed var(--k-n);min-height:0;height:0}
.x3sc{display:flex;gap:8px;flex-wrap:wrap}.x3sc .b{min-width:56px}
.x3bd{display:inline-block;padding:2px 8px;border:1px solid currentColor;font-size:14px;font-weight:600}

/* Raum */
.hit{fill:transparent;stroke:none;pointer-events:all}
.k3ring{fill:none;stroke-width:var(--k-sw);pointer-events:none}
.k3bd{pointer-events:none}
.k3bd .bg{fill:var(--c);stroke-width:var(--k-sw)}
.k3bd path,.k3bd circle.gp{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
[data-st=waechst] .k3ring,[data-st=waechst] .k3bd .bg,[data-st=waechst] .k3bd path{stroke:var(--k-w)}
[data-st=wartet] .k3ring,[data-st=wartet] .k3bd .bg,[data-st=wartet] .k3bd path{stroke:var(--k-t)}
[data-st=ruht] .k3ring,[data-st=ruht] .k3bd .bg,[data-st=ruht] .k3bd path{stroke:var(--k-r)}
[data-st=frist] .k3ring,[data-st=frist] .k3bd .bg,[data-st=frist] .k3bd path{stroke:var(--k-f)}
[data-st=neutral] .k3bd{display:none}
[data-st=neutral] .k3ring,[data-st=none] .k3ring{display:none}
[data-st=waechst] .k3bd circle.gp{fill:var(--k-w)}
html[data-fb=still] .k3ring{display:none}
html[data-fb=still] .k3bd .bg,html[data-fb=still] .k3bd path{stroke:var(--m)}
@keyframes k3p{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
html[data-fb=lebendig] .k3pulse .k3bd{transform-box:fill-box;transform-origin:center;animation:k3p .7s ease}
#rs3{margin:6px 0 10px}
@media(max-width:600px){.x3j b,.x3c b{font-size:23px}}
.x3row{display:flex;width:100%;text-align:left;justify-content:flex-start;align-items:center;margin:0 0 8px;min-height:56px}
.x3rt{display:block}.x3rt b{display:block}.x3rt small{display:block;margin-top:2px}
.x3rs{display:block}
.k3pulse{transform-box:fill-box}
@media(prefers-reduced-motion:reduce){html[data-fb=lebendig] .k3pulse .k3bd{animation:none}}

/* Raum 3.0: Mensch in der Mitte, Kreis mit Punkten */
#x3w{display:none;max-width:560px;margin:4px auto 0}
body.v3 #x3w{display:block}
body.v3 #sc>svg,body.v3 #sc>p.m{display:none}
#x3sv{display:block;width:100%;height:auto;overflow:visible}
.x3disc{fill:var(--c);stroke:none}
.x3ring{fill:none;stroke:var(--ln);stroke-width:3}
.x3dot,.x3heart{cursor:pointer;color:var(--k-n)}
.x3dot .dd{fill:var(--c);stroke:var(--k-n);stroke-width:4}
.x3dot .nw{fill:none;stroke:var(--ac);stroke-width:3}
.x3dot[data-s=offen] .dd,.x3dot[data-s=gestartet] .dd{stroke:var(--k-t)}
.x3dot[data-s=erledigt] .dd{fill:var(--k-w);stroke:var(--k-w)}
.x3dot[data-s=ausgesetzt]{color:var(--k-r)}.x3dot[data-s=ausgesetzt] .dd{stroke:var(--k-r)}
.x3dot[data-s=uebersprungen] .dd{stroke:var(--k-n);stroke-dasharray:6 5}
.x3dot[data-s=unbekannt] .dd{stroke:var(--k-n);stroke-dasharray:3 5}
.x3more{font:600 22px -apple-system,system-ui,sans-serif;fill:var(--m)}
.x3dot:focus-visible,.x3heart:focus-visible,#x3sv .hit.h:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.x3heart .k3bd .bg{fill:var(--c);stroke-width:4}
.x3heart[data-st=waechst] .k3bd .bg,.x3heart[data-st=waechst] .k3bd path{stroke:var(--k-w)}
.x3heart[data-st=wartet] .k3bd .bg,.x3heart[data-st=wartet] .k3bd path{stroke:var(--k-t)}
.x3heart[data-st=ruht] .k3bd .bg,.x3heart[data-st=ruht] .k3bd path{stroke:var(--k-r)}
html[data-fb=still] .x3dot[data-s=erledigt] .dd{fill:var(--m);stroke:var(--m)}
html[data-fb=lebendig] .k3pulse .dd{transform-box:fill-box;transform-origin:center;animation:k3p .7s ease}
@media(prefers-reduced-motion:reduce){html[data-fb=lebendig] .k3pulse .dd{animation:none}}
body.v3 main{display:flex;flex-direction:column}
body.v3 #sc{order:-1}
#x3w{max-width:440px}

#x3w{max-width:720px}
.x3lbl{font:500 30px -apple-system,system-ui,sans-serif;fill:var(--tx)}
.x3lbl.c{font-size:26px;fill:var(--m)}
.x3dot[data-s=erledigt] .x3lbl{fill:var(--m)}
.x3sm{cursor:pointer}
.x3sm .ic{fill:none;stroke:var(--k-t);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.x3sm:nth-of-type(n) .ic{}
.x3sm[data-u=labendstretch] .ic{stroke:var(--k-r)}
.x3sm[data-s=erledigt] .ic{stroke:var(--k-w)}
.x3sm .ck{fill:var(--k-w)}
.x3sm:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

.x3dot .ld{stroke:var(--ln);stroke-width:2;fill:none}

.x3dot .ld{stroke:var(--k-n);stroke-opacity:.45}

/* Aufgaben, Verlauf */
.x3dot[data-s=teil] .dd{stroke:var(--k-t);stroke-width:4}
.x3dm{font-size:15px;font-weight:600;fill:var(--tx);pointer-events:none}
.x3dot[data-s=teil] .x3dm{fill:var(--k-t)}
.x3act{justify-content:center;margin:6px 0 4px}
.x3tk{gap:10px;flex-wrap:wrap;align-items:flex-end}
.x3tk .g{flex:1 1 160px}.x3tk label small{display:block}
.x3tk input{width:100%}.x3tk .x3tmi{width:92px}
.x3mn{align-items:center;margin-bottom:12px}
.x3sum{grid-template-columns:repeat(2,1fr);margin-bottom:6px}
.x3cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.x3wd{text-align:center;font-size:13px;color:var(--m)}
.x3cd{height:44px;min-width:0;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;border-radius:10px;padding:0;cursor:pointer}
.x3cd[data-lv="n"]{color:var(--m);border-style:dashed}
.x3cd[data-lv="1"]{background:color-mix(in srgb,var(--k-w) 18%,var(--bg))}
.x3cd[data-lv="2"]{background:color-mix(in srgb,var(--k-w) 38%,var(--bg))}
.x3cd[data-lv="3"]{background:color-mix(in srgb,var(--k-w) 62%,var(--bg))}
.x3cd[data-lv="4"]{background:var(--k-w);border-color:var(--k-w);color:#fff;font-weight:600}
.x3cd[data-today]{outline:2.5px solid var(--ac);outline-offset:1px}

  if (!mins) lv = 'std';
  const m2 = lv == 'mini' ? U.mini : lv == 'plus' ? U.plus : U.std;

    X3.run = { u: uid, lv, total: m2 * 60, end: Date.now() + m2 * 60000, left: m2 * 60, ck: [], paused: false, over: false };

  }

}
function x3saveRun() { try { X3.run ? localStorage.setItem('los_k3run', JSON.stringify(X3.run)) : localStorage.removeItem('los_k3run') } catch (x) { } }
function x3loadRun() {
  try {

  } catch (x) { X3.run = null }
}
function x3tick() {
  const R = X3.run; if (!R) return;
  if (!R.paused && !R.over) {
    R.left = Math.max(0, Math.round((R.end - Date.now()) / 1000));
    if (R.left == 0) {

      try { beep() } catch (x) { }
      toast('Zeit ist um: ' + title3(R.u));
      if (CV && CV[0] == 'einheit' && CV[1][0] == R.u && !$('#v').hidden) V.einheit(R.u); else if (!$('#hd').hidden && typeof heute == 'function') heute();

}
function x3finish(uid, partial) {

  let min = U.std, lv = 'std', ck = 0;
  if (R) {
    lv = R.lv; const planned = Math.round(R.total / 60), left = R.over ? 0 : R.paused ? R.left : Math.max(0, (R.end - Date.now()) / 1000);
    const el = Math.max(1, Math.round((R.total - left) / 60));
    min = partial ? el : planned; ck = (R.ck || []).filter(Boolean).length;
  } else { const c = (X3.ck || {})[uid] || []; ck = c.filter(Boolean).length }
  ev3(uid, 'erledigt', { lv, min, ck });
  X3.run = null; x3saveRun();
  x3pulse(uid);
  V.einheit(uid);
}
function x3reicht() {

  pl.units.filter(u => K3.OPEN.includes(u.st.s)).forEach(u => ev3(u.id, 'ausgesetzt', { why: 'heute-reicht', grp: g }));

  heute();
}
function x3reopen() {

  S.k3.events.filter(x => x.k == 'ausgesetzt' && x.why == 'heute-reicht' && x.at >= t0 && !rv.has(x.id)).forEach(x => ev3(x.u, 'widerruf', { ref: x.id }));
